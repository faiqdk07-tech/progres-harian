<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Progres Harian Terpadu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS Liquid Glass — wallpaper gradasi lembut, panel kaca blur, daftar berkelompok sudut 12px, judul besar, ikon kotak warna ala Settings, tab bar kaca mengambang; satu kolom maks 640px */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --ink:#000000; --ink2:#3C3C43; --muted:#8A8A8E; --sep:#C6C6C8; --fill:rgba(118,118,128,.12); --cellbg:#FAFAFC;
  --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30; --indigo:#5856D6; --pink:#FF2D55; --teal:#30B0C7; --purple:#AF52DE;
  --green-ink:#248A3D; --orange-ink:#C93400; --red-ink:#D70015; --blue-ink:#0040DD;
  --green-soft:#E4F7E8; --orange-soft:#FFF1DE; --red-soft:#FFE5E3; --blue-soft:#E3EEFF;
  --md:#007AFF; --vl:#AF52DE; --seg-on:#FFFFFF; --glass:rgba(249,249,249,.78); --shadow:rgba(0,0,0,.12);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --fm:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1C22; --card:#26262C; --card2:#34343A; --ink:#FFFFFF; --ink2:#EBEBF5; --muted:#98989F; --sep:#38383A; --fill:rgba(118,118,128,.24); --cellbg:#232325;
  --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --indigo:#5E5CE6; --pink:#FF375F; --teal:#40C8E0; --purple:#BF5AF2;
  --green-ink:#30D158; --orange-ink:#FFB340; --red-ink:#FF6961; --blue-ink:#409CFF;
  --green-soft:#16301D; --orange-soft:#3A2A10; --red-soft:#3D1715; --blue-soft:#0F2A4A;
  --md:#409CFF; --vl:#DA8FFF; --seg-on:#636366; --glass:rgba(30,30,30,.78); --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1C22; --card:#26262C; --card2:#34343A; --ink:#FFFFFF; --ink2:#EBEBF5; --muted:#98989F; --sep:#38383A; --fill:rgba(118,118,128,.24); --cellbg:#232325;
  --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --indigo:#5E5CE6; --pink:#FF375F; --teal:#40C8E0; --purple:#BF5AF2;
  --green-ink:#30D158; --orange-ink:#FFB340; --red-ink:#FF6961; --blue-ink:#409CFF;
  --green-soft:#16301D; --orange-soft:#3A2A10; --red-soft:#3D1715; --blue-soft:#0F2A4A;
  --md:#409CFF; --vl:#DA8FFF; --seg-on:#636366; --glass:rgba(30,30,30,.78); --shadow:rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.3 var(--f);letter-spacing:-.01em;margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(120px + env(safe-area-inset-bottom,0px))}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}


/* judul besar */
.lt{display:flex;align-items:flex-end;gap:12px;padding:18px 4px 12px}
.lt .grow{flex:1;min-width:0}
.lt .eb{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.01em}
.lt h1{font:700 34px/1.1 var(--fd);letter-spacing:-.025em;margin:2px 0 0;text-wrap:balance}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;padding-top:4px}
.sync b{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok{display:none} .sync.busy b{background:var(--orange)} .sync.err b{background:var(--red)}

/* daftar berkelompok */
.sh{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.01em;padding:22px 16px 7px;display:flex;gap:8px}
.sh span:nth-child(2){margin-left:auto;text-transform:none}
.sh.chh span:first-child{text-transform:none;font-weight:600;color:var(--ink2);font-size:15px}
.foot{font-size:13px;color:var(--muted);padding:7px 16px 0}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;position:relative;width:100%;border:0;background:none;text-align:left;cursor:default;color:var(--ink)}
button.row{cursor:pointer}
button.row:active{background:var(--fill)}
.row .rt{flex:1;min-width:0}
.row .t{font-size:17px;overflow-wrap:break-word}
.row .s{font-size:14px;color:var(--muted);margin-top:2px;overflow-wrap:break-word}
.row .rv{color:var(--muted);font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:6px}
.xp{position:relative;padding:12px 16px 16px 52px;display:grid;gap:12px}
.group.plain .xp{padding-left:16px}
.row+.row::before,.xp+.row::before,.row+.xp::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--sep)}
.group.plain .row+.row::before,.group.plain .xp+.row::before,.group.plain .row+.xp::before{left:16px}
.chev{width:8px;height:8px;border:solid var(--muted);opacity:.6;border-width:2px 2px 0 0;transform:rotate(45deg);flex:none;margin-left:2px;transition:transform .2s}
.open .chev{transform:rotate(135deg)}
.xp .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.sub{background:var(--card2);border-radius:10px;overflow:hidden}
.sub .row{min-height:40px;padding:8px 12px}
.sub .row+.row::before{left:46px}
.sub .row .t{font-size:16px}

/* centang ala Reminders */
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--sep);flex:none;display:grid;place-items:center;background:none;padding:0}
button.chk{cursor:pointer}
.chk[aria-pressed="true"],.chk.on{background:var(--green);border-color:var(--green)}
.chk[aria-pressed="true"]::after,.chk.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:translateY(-1px) rotate(45deg)}
.chk.part{border-color:var(--orange);background:conic-gradient(var(--orange) 50%,transparent 0)}
.chk.warn{border-color:var(--red)}

.badge{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--green-soft);color:var(--green-ink)} .b-warn{background:var(--orange-soft);color:var(--orange-ink)} .b-bad{background:var(--red-soft);color:var(--red-ink)} .b-0{background:var(--fill);color:var(--muted)}
.code{font-family:var(--fm);font-size:13px;font-weight:600}
.c-MD{color:var(--md)} .c-VL{color:var(--vl)}
.dotn{min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:13px;font-weight:600;display:inline-grid;place-items:center;padding:0 6px}

/* tabel isian */
.gw{overflow-x:auto;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 .5px var(--sep)}
table.grid{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
.grid th{background:var(--card2);color:var(--muted);font-size:12px;font-weight:600;text-align:center;padding:6px;border-right:.5px solid var(--sep);border-bottom:.5px solid var(--sep);white-space:nowrap}
.grid td{border-right:.5px solid var(--sep);border-bottom:.5px solid var(--sep);padding:0;height:36px;text-align:right}
.grid tr:last-child td{border-bottom:0}
.grid th:last-child,.grid td:last-child{border-right:0}
.grid td.l{text-align:left;padding:0 8px;white-space:nowrap}
.grid td.l small{display:block;font-size:11px;color:var(--muted);line-height:1;margin-top:1px}
.grid td.c{text-align:center}
.grid td.w{text-align:left;padding:6px 8px;font-size:14px;line-height:1.3;min-width:150px}
.grid td.v{padding:0 8px;font-weight:600}
.grid td.ro{color:var(--muted);padding:0 8px}
.grid tr.gh td{background:var(--bg);text-align:left;font-size:12px;font-weight:700;padding:5px 8px;height:auto}
.grid tr.gh td.g-MD{color:var(--md)} .grid tr.gh td.g-VL{color:var(--vl)}
.cell{width:100%;min-width:40px;height:36px;border:0;background:var(--cellbg);text-align:right;padding:0 8px;font-variant-numeric:tabular-nums;font-size:16px;color:var(--ink);border-radius:0;-moz-appearance:textfield}
.cell::-webkit-outer-spin-button,.cell::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cell:focus{outline:2px solid var(--blue);outline-offset:-2px;background:var(--card)}
td.hit{background:var(--green-soft)} td.hit .cell{background:transparent;color:var(--green-ink);font-weight:600}
td.miss{background:var(--red-soft)} td.miss .cell{background:transparent;color:var(--red-ink);font-weight:600}
.good{color:var(--green-ink)} .bad{color:var(--red-ink)}
.grid .chk{width:22px;height:22px;margin:0 auto}
.txt{overflow:hidden;width:100%;border:0;background:var(--card2);border-radius:10px;padding:9px 12px;font-size:16px;resize:vertical;min-height:40px;color:var(--ink)}
.txt:focus{outline:2px solid var(--blue);outline-offset:-1px}
.hint{font-size:13px;color:var(--muted);line-height:1.4}
.lock{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.lock .lbl{min-width:84px}
.rvh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px}
.qtext{white-space:pre-wrap;font-size:16px;line-height:1.45;overflow-wrap:anywhere}

/* chip kata */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--fill);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff}

/* segmented control */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin:4px 0 2px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:6px 4px;font-size:13px;line-height:1.2;font-weight:500;cursor:pointer;min-width:0;overflow-wrap:break-word;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
.seg.sj{background:none;padding:0;gap:18px;margin-top:12px;justify-content:flex-start;border-bottom:.5px solid var(--sep);border-radius:0}
.seg.sj button{flex:none;padding:8px 0;border-radius:0;font-size:16px;color:var(--muted)}
.seg.sj button[aria-pressed="true"]{background:none;color:var(--ink);box-shadow:inset 0 -2px 0 var(--blue)}

/* kalender */
.mh{display:flex;align-items:center;padding:14px 16px 0;gap:8px}
.mh h2{font:700 20px var(--fd);margin:0;flex:1;color:var(--ink)}
.mh button{border:0;background:none;color:var(--blue);font-size:26px;cursor:pointer;padding:0 8px;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);padding:8px 16px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;padding:12px 8px 14px}
.cal .dn{font-size:12px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:4px}
.cal button{border:0;background:none;cursor:pointer;display:grid;justify-items:center;padding:2px 0;color:var(--ink)}
.cal button b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:400;font-variant-numeric:tabular-nums;position:relative}
.cal .cd b em,.wd .wc em{font-style:normal;position:relative}
.cal .cd.ok b{background:var(--green);color:#fff;font-weight:600}
.cal .cd.pt b{background:conic-gradient(var(--red) calc(var(--p)*1%),var(--fill) 0)}
.cal .cd.pt b::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--card)}
.cal .cd.today:not(.ok):not(.pt) b{color:var(--red);font-weight:700}
.cal .cd.sel b{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--blue)}
.cal .cd.sel:not(.ok):not(.pt) b{background:var(--red);color:#fff;box-shadow:none}
.cal .cd.sel:not(.today):not(.ok):not(.pt) b{background:var(--ink);color:var(--card)}
.lg{display:inline-flex;align-items:center;gap:5px}
.lg i{width:11px;height:11px;border-radius:50%;display:inline-block}
.lg-ok{background:var(--green)}
.lg-pt{background:conic-gradient(var(--red) 50%,var(--fill) 0)}

/* formulir */
.fr{display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 16px;position:relative}
.fr+.fr::before,.btnrow+.btnrow::before,.row+.btnrow::before,.row+.fr::before,.fr+.btnrow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.fr label{flex:1;font-size:17px}
.fr input,.fr select{border:0;background:none;text-align:right;font-size:17px;color:var(--muted);max-width:60%;padding:4px 0}
.fr input:focus,.fr select:focus{color:var(--ink);outline:none}
.fr textarea{flex:1;border:0;background:none;font-size:17px;resize:vertical;min-height:70px;padding:6px 0;color:var(--ink)}
.btnrow{display:flex;justify-content:center;align-items:center;width:100%;border:0;background:none;color:var(--blue);font-size:17px;min-height:44px;cursor:pointer;padding:0 16px;position:relative}
.btnrow.red{color:var(--red)}
.btnrow.pri{background:var(--blue);color:#fff;font-weight:600;border-radius:12px;min-height:50px}
textarea.dump{width:100%;min-height:90px;font:12px var(--fm);border:0;background:var(--card);border-radius:12px;padding:10px 12px;color:var(--ink)}

/* tab bar kaca */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;width:min(520px,calc(100% - 32px));background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:.5px solid var(--sep);border-radius:30px;box-shadow:0 8px 30px var(--shadow);padding:5px}
.tabbar nav{display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar a{display:grid;justify-items:center;gap:2px;text-decoration:none;color:var(--ink);opacity:.62;font-size:10.5px;font-weight:600;padding:6px 0;border-radius:24px}
.tabbar a[aria-current="page"]{color:var(--blue);opacity:1;background:var(--fill)}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);color:var(--ink);box-shadow:0 6px 24px var(--shadow);padding:10px 18px;border-radius:22px;font-size:15px;font-weight:500;z-index:20;max-width:calc(100% - 32px);text-align:center}

/* evaluasi */
.lvdot{width:12px;height:12px;border-radius:50%;flex:none;margin:0 6px;background:var(--sep)}
.lv-lemah{background:var(--red)} .lv-waspada{background:var(--orange)} .lv-aman{background:var(--green)} .lv-kosong{background:none;box-shadow:inset 0 0 0 1.5px var(--sep)}
.chdots{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end;max-width:45%}
.chdots .lvdot{width:9px;height:9px;margin:0}
.j-K{background:var(--red-soft);color:var(--red-ink)} .j-H{background:var(--orange-soft);color:var(--orange-ink)}
.j-W{background:color-mix(in srgb,var(--purple) 16%,transparent);color:var(--vl)} .j-T{background:var(--blue-soft);color:var(--blue-ink)}
.jgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.jt{border:0;border-radius:12px;padding:9px 4px;display:grid;justify-items:center;gap:1px;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px transparent;min-width:0}
.jt b{font:700 21px var(--fd)}
.jt span{font-size:11px;font-weight:600;text-align:center;line-height:1.2}
.jt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px currentColor}
.jt:not([class*="j-"])[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--blue)}

/* beranda */
.home{display:grid}
.hhead{padding-top:6px}
.hbar{display:flex;align-items:center;gap:8px}
.gb{width:34px;height:34px;border-radius:50%;border:0;background:var(--fill);color:var(--blue);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center}
.gb.wide{width:auto;padding:0 14px;font-size:15px;font-weight:600;border-radius:999px}
.bub{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
.hgreet{padding:14px 4px 14px}
.hgreet h1{font:700 34px/1.1 var(--fd);letter-spacing:-.025em;margin:0}
.hgreet p{margin:4px 0 0;font-size:15px;color:var(--muted)}
.scards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.scard{background:var(--card);border-radius:14px;padding:12px;display:grid;justify-items:start;gap:2px;min-width:0}
.scard .ic{margin-bottom:8px}
.scard .sl{font-size:13px;color:var(--muted);font-weight:600}
.scard b{font:700 24px/1.1 var(--fd);font-variant-numeric:tabular-nums}
.scard .ss{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pcard{margin-top:10px;background:var(--card);border-radius:14px;padding:14px 16px}
.pc{display:grid;gap:10px;min-width:0}
.pc>b{font-size:17px;font-weight:600}
.segs{display:flex;align-items:center;gap:4px}
.segs i{flex:1;height:8px;border-radius:999px;background:var(--fill)}
.segs i.on{background:var(--green)} .segs i.part{background:linear-gradient(90deg,var(--orange) 50%,var(--fill) 50%)}
.segs span{font-weight:600;font-size:15px;margin-left:6px;font-variant-numeric:tabular-nums;color:var(--muted)}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchips span,.pchips button{font:inherit;font-size:13px;font-weight:500;background:var(--fill);color:var(--ink2);border:0;border-radius:999px;padding:5px 11px}
.pchips button{background:var(--red-soft);color:var(--red-ink);font-weight:600;cursor:pointer}
.stk{margin-top:10px;background:var(--card);border-radius:14px;padding:14px 16px}
.stkh{display:flex;align-items:center;gap:6px}
.stkh>div{flex:1}
.stkh b{display:block;font-size:17px;font-weight:600}
.stkh span{font-size:14px;color:var(--muted)}
.gb2{width:30px;height:30px;border-radius:50%;border:0;background:var(--fill);color:var(--blue);font-size:19px;line-height:1;cursor:pointer}
.wkl{display:grid;grid-template-columns:repeat(7,1fr);margin-top:14px;position:relative}
.wkl .trk{display:none}
.wd{border:0;background:none;padding:0;display:grid;justify-items:center;gap:6px;cursor:pointer;position:relative;color:var(--ink)}
.wd .wl{font-size:12px;color:var(--muted);font-weight:600}
.wd .wc{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:500;background:var(--fill);font-variant-numeric:tabular-nums;position:relative}
.wd.ok .wc{background:var(--green);color:#fff}
.wd .wc svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.wd.pt .wc{background:conic-gradient(var(--red) calc(var(--p)*1%),var(--fill) 0)}
.wd.pt .wc::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--card)}
.wd.pt .wc em{color:var(--red-ink);font-weight:600}
.wd.fut .wc{background:none;color:var(--muted)}
.wd.today .wl{color:var(--red)}
.wd.sel .wc{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--blue)}
.wd.out{opacity:.3;pointer-events:none}
.stkf{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:12px}
.th{display:flex;align-items:baseline;gap:8px;padding:24px 4px 8px}
.th b{font:700 20px var(--fd);letter-spacing:-.01em;flex:1}
.th span{font-size:14px;color:var(--muted)}
.tasks{background:var(--card);border-radius:12px;overflow:hidden}
.tasks>*{position:relative}
.tasks>*+*::before{content:"";position:absolute;top:0;left:58px;right:0;height:.5px;background:var(--sep);z-index:1}
.tasks>.card>.row::before{display:none}
.card>.xp{padding:4px 16px 16px 58px}
.card>.xp::before{left:58px}
.ic{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}

.study-order .step-no{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--card2);box-shadow:inset 0 0 0 .5px var(--rim);color:var(--blue);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.study-order .study-step .rt{flex:1;min-width:0}
.study-order .study-step .t{font-size:16px;overflow-wrap:break-word}

.steps>*+*::before{left:52px}

.steps .card>.xp{padding:2px 14px 16px 16px}

b":"Visualisasi Benda","awal":"Sudah","unit":"VL-21–23"},{"kode":"VL-23","subj":"Verbal & Logika Dasar","ch":"Penalaran Verbal","sub":"Kuantifikasi","awal":"Sudah","unit":"VL-21–23"},{"kode":"VL-24","subj":"Verbal & Logika Dasar","ch":"Logika Informal","sub":"Logika Informal","awal":"Dijadwalkan","unit":"VL-24"}],"errors":[{"id":"e1","tgl":"2026-10-20","kode":"MD-12","jenis":"H · Salah baca soal","soal":"Sebanyak 3/8 dari siswa di sebuah kelas bimbingan adalah anggota klub robotik. Jika 15 siswa bukan anggota klub robotik, jumlah seluruh siswa di kelas itu adalah ...\nA. 18\nB. 24\nC. 25\nD. 30\nE. 40","jawabku":"E. 40","bahas":"B.           Anggota robotik: 3/8 dari seluruh siswa.\n\t•\tBukan anggota robotik: 1 − 3/8 = 5/8 dari seluruh siswa.\n\t•\tJadi 5/8 × N = 15, sehingga N = 15 × 8/5 = 24.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e2","tgl":"2026-10-20","kode":"MD-14","jenis":"K · Belum paham konsep","soal":"Hasil pembulatan 6,249 ke satu angka di belakang koma adalah ...\nA. 6,2\nB. 6,24\nC. 6,25\nD. 6,3\nE. 6,5","jawabku":"D. 6,3","bahas":"A. Pembulatan ke satu angka di belakang koma hanya melihat angka kedua di belakang koma, yaitu 4 (kurang dari 5), jadi 6,2. Jawabanmu D (6,3) salah. Itu hasil membulatkan bertahap: 6,249 → 6,25 → 6,3. Pembulatan harus sekali saja, dari angka aslinya.","status":"Ulang benar","sesiManual":null,"asal":"Materi Baru (LOTS)"},{"id":"e3","tgl":"2026-10-21","kode":"VL-24","jenis":"K · Belum paham konsep","soal":"Semua karyawan di kantor itu datang naik kereta. Lukman adalah karyawan di kantor itu. Jadi, Lukman datang naik kereta. Penalaran tersebut tergolong ...\nA. induktif\nB. analogi\nC. sebab-akibat\nD. deduktif\nE. generalisasi","jawabku":"E. Generalisasi","bahas":"Deduktif bergerak dari aturan umum ke kasus khusus dan kesimpulannya pasti. Generalisasi dan induktif bergerak dari beberapa kasus ke kesimpulan umum dan hanya bersifat mungkin.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e4","tgl":"2026-10-21","kode":"MD-07","jenis":"T · Kurang teliti","soal":"Hitunglah 125 × 37 × 8. (Tulislah jawaban Anda dengan angka!)","jawabku":"4625.0","bahas":"Hanya menghitung dari 125x37, padahal masih ada angka 8. Jadi hasil akhir =37000","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e5","tgl":"2026-10-21","kode":"MD-01","jenis":"K · Belum paham konsep","soal":"Diketahui K = {2, 4, 6, 8}. Ada lebih dari satu jawaban benar. Pilih semua yang benar. Pernyataan yang BENAR adalah ...\nA. 4 ∈ K\nB. 5 ∉ K\nC. n(K) = 8\nD. {2, 4} adalah himpunan bagian dari K\nE. 6 ∉ K","jawabku":"ABE","bahas":"•\tA. 4 ∈ K: benar, karena 4 adalah anggota K.\n\t•\tB. 5 ∉ K: benar, karena 5 bukan anggota K.\n\t•\tC. n(K) = 8: salah. n(K) adalah banyak anggota, yaitu 4. Angka 8 hanya salah satu anggotanya.\n\t•\tD. {2, 4} himpunan bagian dari K: benar, karena semua anggota {2, 4} ada di K.\n\t•\tE. 6 ∉ K: salah, karena 6 adalah anggota K, jadi yang benar 6 ∈ K.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e6","tgl":"2026-10-21","kode":"MD-01","jenis":"K · Belum paham konsep","soal":"Diketahui A = {1, 2, 3, 4} dan B = {3, 4, 5}. Perhatikan pernyataan berikut.\n(1) A ∩ B = {3, 4, 5}\n(2) n(A ∪ B) = 5\n(3) 5 ∈ A\n(4) A − B = {1, 2}\nPernyataan yang benar adalah ...\nA. (1), (2), dan (3)\nB. (1) dan (3)\nC. (2) dan (4)\nD. (4) saja\nE. (1), (2), (3), dan (4)","jawabku":"C. (2) dan (4)","bahas":"•\t(1) A ∩ B = {3, 4, 5}: salah. Irisan hanya memuat anggota yang ada di A dan B, yaitu {3, 4}. Angka 5 hanya ada di B.\n\t•\t(2) n(A ∪ B) = 5: benar. Gabungannya {1, 2, 3, 4, 5}, jadi ada 5 anggota.\n\t•\t(3) 5 ∈ A: salah, karena 5 tidak ada di A.\n\t•\t(4) A − B = {1, 2}: benar, karena anggota A yang tidak ada di B adalah 1 dan 2.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e7","tgl":"2026-10-21","kode":"MD-01","jenis":"K · Belum paham konsep","soal":"Diketahui P = {x | x faktor dari 12} dan Q = {x | x bilangan asli genap kurang dari 10}. Nilai n(P ∩ Q) adalah ...\nA. 2\nB. 3\nC. 4\nD. 5\nE. 6","jawabku":"E. 6","bahas":"•\tP = faktor dari 12 = {1, 2, 3, 4, 6, 12}\n\t•\tQ = bilangan asli genap kurang dari 10 = {2, 4, 6, 8}\n\t•\tP ∩ Q = {2, 4, 6}, jadi n(P ∩ Q) = 3","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e8","tgl":"2026-10-22","kode":"MD-13","jenis":"H · Salah baca soal","soal":"Soal: Sebuah toko menjual 3/5 dari seluruh persediaan beras pada pagi hari. Dari beras yang masih tersisa setelah penjualan pagi, 1/4 dijual pada sore hari. Setelah penjualan sore, masih tersisa 30 kg. Persediaan beras mula-mula adalah ... kg. A. 50 B. 75 C. 100 D. 150 E. 200","jawabku":"E. 200","bahas":"Jawaban benar & pembahasan: C (100)\n• Konsep: \"1/4 dari yang tersisa\" memakai basis sisa, bukan total awal.\n• Langkah: sisa pagi = 2/5. Sore terjual 1/4 dari sisa, jadi sisa akhir = 3/4 × 2/5 = 3/10 dari mula-mula. 3/10 × x = 30, maka x = 100.\n• Jebakan: kalau 1/4 dihitung dari total awal, terjual 3/5 + 1/4 = 17/20, sisa 3/20, dan 30 ÷ 3/20 = 200 (pilihanmu).)","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e9","tgl":"2026-10-22","kode":"VL-16","jenis":"H · Salah baca soal","soal":"Soal: Diketahui ¬p ∨ q bernilai salah dan r ∨ q bernilai benar. Nilai kebenaran p, q, dan r berturut-turut adalah .... A. benar, benar, benar B. salah, salah, benar C. benar, salah, benar D. benar, salah, salah E. salah, benar, benar","jawabku":"A (benar, benar, benar)","bahas":"C (benar, salah, benar)\n• Konsep: disjungsi hanya salah jika kedua bagiannya salah.\n• Langkah: ¬p ∨ q salah, jadi ¬p salah (p benar) dan q salah. Lalu r ∨ q benar dengan q salah, sehingga r harus benar. Hasilnya p = B, q = S, r = B.\n• Jebakan: p benar terasa cocok, lalu q ikut dianggap benar. Padahal q benar akan membuat ¬p ∨ q benar, bertentangan dengan soal.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e10","tgl":"2026-10-22","kode":"VL-14","jenis":"H · Salah baca soal","soal":"Jika p ∧ q bernilai salah dan p bernilai benar, maka ¬q bernilai .... A. benar B. salah C. dapat benar maupun salah D. tidak dapat ditentukan karena nilai q tidak diketahui E. sama dengan nilai ¬p","jawabku":"B (salah)","bahas":"Jawaban benar & pembahasan: A (benar)\n• Konsep: konjungsi benar hanya jika kedua bagiannya benar.\n• Langkah: p benar dan p ∧ q salah, maka q salah. Jadi ¬q benar.\n• Jebakan: q memang bernilai \"salah\", sehingga mudah menjawab nilai q dan melewatkan negasinya.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e11","tgl":"2026-10-22","kode":"MD-15","jenis":"T · Kurang teliti","soal":"Berdasarkan informasi yang diberikan, manakah hubungan antara kuantitas P dan Q berikut yang benar? x adalah bilangan desimal. P = 0,5 × x, Q = x + 0,5. (A. P > Q, B. P < Q, C. P = Q, D. Tidak dapat ditentukan)","jawabku":"B. P<Q","bahas":"Jawaban benar & pembahasan:\n• Konsep: Kalau nilai P dan Q bergantung pada variabel yang tanda atau nilainya tidak ditentukan, hubungannya bisa berubah-ubah, jadi jawabannya D.\n• Langkah: Coba x = 0, maka P = 0 dan Q = 0,5, jadi P < Q. Coba x = −4, maka P = −2 dan Q = −3,5, jadi P > Q. Dua hasil berbeda berarti D.","status":"Ulang benar","sesiManual":null,"asal":"Materi Baru (MOTS)"},{"id":"e12","tgl":"2026-10-23","kode":"VL-20","jenis":"H · Salah baca soal","soal":"Pak Ega melihat bahwa kota A, yang mirip kota B dalam jumlah penduduk dan besar anggaran, berhasil mengurangi kemacetan dengan bus cepat. Ia menyimpulkan bahwa kota B juga akan berhasil jika memakai bus cepat. Penalaran Pak Ega paling tepat disebut .... A. Deduktif\nB. Generalisasi\nC. Sebab-akibat\nD. Analogi\nE. Silogisme","jawabku":"B. Generalisasi","bahas":"Jawaban benar & pembahasan: D\n• Konsep: Analogi menyimpulkan bahwa dua hal yang mirip akan punya hasil yang sama. Generalisasi menyimpulkan sifat seluruh kelompok dari sejumlah anggota sampelnya.\n• Langkah: Penalaran di sini membandingkan dua kasus (kota A dan kota B) berdasarkan kemiripan, lalu memindahkan hasilnya dari A ke B. Tidak ada sampel yang dinaikkan ke populasi.\n• Jebakan: Pola \"dari kasus ke kesimpulan\" sama-sama bersifat induktif, jadi mudah tertukar. Cek dulu: apakah ada sampel dari satu kelompok (generalisasi), atau dua hal yang dibandingkan (analogi)?","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e13","tgl":"2026-10-23","kode":"VL-24","jenis":"H · Salah baca soal","soal":"Semua pengendara yang lolos uji emisi mendapat stiker. Ani adalah pengendara dan tidak mendapat stiker. Dewi adalah pengendara dan mendapat stiker. Berdasarkan informasi tersebut, manakah pernyataan yang PASTI BENAR?\nA. Dewi lolos uji emisi.\nB. Ani lolos uji emisi, tetapi belum mengambil stiker.\nC. Dewi tidak lolos uji emisi.\nD. Ani dan Dewi sama-sama lolos uji emisi.\nE. Ani tidak lolos uji emis","jawabku":"A. Dewi lolos ujian emisi","bahas":"Jawaban benar & pembahasan: E\n• Konsep: \"Semua yang lolos → mendapat stiker\". Kontraposisinya: \"tidak mendapat stiker → tidak lolos\". Kebalikannya (\"mendapat stiker → lolos\") tidak dijamin.\n• Langkah: Ani tidak mendapat stiker, jadi Ani pasti tidak lolos uji emisi. Dewi mendapat stiker, tetapi itu tidak memastikan ia lolos.\n• Jebakan: A tampak wajar karena Dewi mendapat stiker. Itu menganggap stiker hanya diberikan kepada yang lolos, padahal premis tidak menyebut begitu.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e14","tgl":"2026-10-24","kode":"MD-01","jenis":"K · Belum paham konsep","soal":"Diketahui S = {a, b, c, d}. Banyak himpunan bagian S yang memiliki paling banyak 2 anggota adalah ....\nA. 4 B. 6 C. 8 D. 10 E. 11","jawabku":"C (8)","bahas":"Jawaban benar & pembahasan: E (11)\n• Konsep: Kelompokkan himpunan bagian menurut banyak anggotanya. \"Paling banyak 2\" berarti ukuran 0, 1, dan 2.\n• Langkah: Ukuran 0 ada 1 (himpunan kosong), ukuran 1 ada 4, ukuran 2 ada 6. Jumlahnya 1 + 4 + 6 = 11.\n• Jebakan: 8 adalah 2³, hasil yang menggoda dari rumus 2ⁿ. 6 hanya menghitung ukuran 2. 10 lupa himpunan kosong.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e15","tgl":"2026-10-24","kode":"MD-01","jenis":"K · Belum paham konsep","soal":"Dari 36 siswa, 20 siswa mengikuti klub robotik, 16 siswa mengikuti klub debat, dan 8 siswa mengikuti keduanya. Berdasarkan informasi di atas, tentukan apakah setiap pernyataan berikut bernilai BENAR atau SALAH.\nI. Banyak siswa yang hanya mengikuti klub robotik adalah 12.\nII. Banyak siswa yang mengikuti paling sedikit satu klub adalah 28.\nIII. Banyak siswa yang tidak mengikuti klub apa pun adalah 6.","jawabku":"I-B, II-S, III-S","bahas":"Jawaban benar & pembahasan: I-B, II-B, III-S\n• Konsep: |R ∪ D| = |R| + |D| − |R ∩ D|. Anggota irisan terhitung dua kali bila hanya dijumlahkan.\n• Langkah: I: 20 − 8 = 12 (benar). II: 20 + 16 − 8 = 28 (benar). III: 36 − 28 = 8, jadi pernyataan \"6\" salah.\n• Jebakan: 20 + 16 = 36 terlihat seperti semua siswa ikut klub. Padahal 8 siswa terhitung dua kali.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e16","tgl":"2026-10-26","kode":"MD-11","jenis":"H · Salah baca soal","soal":"Diketahui p dan q adalah bilangan bulat positif. Berapakah nilai p × (q + 5)?\n(1) p × q = 12.\n(2) p + q = 7.\nPutuskan apakah pernyataan (1) dan (2) berikut cukup untuk menjawab pertanyaan tersebut.\nA. Pernyataan (1) SAJA cukup, tetapi pernyataan (2) SAJA tidak cukup.\nB. Pernyataan (2) SAJA cukup, tetapi pernyataan (1) SAJA tidak cukup.\nC. DUA pernyataan BERSAMA-SAMA cukup, tetapi SATU pernyataan SAJA tidak cukup.\nD. Pernyataan (1) SAJA cukup dan pernyataan (2) SAJA cukup.\nE. Pernyataan (1) dan (2) tidak cukup untuk menjawab pertanyaan.","jawabku":"A. Pernyataan (1) SAJA cukup, tetapi pernyataan (2) SAJA tidak cukup.","bahas":"Jawaban benar & pembahasan: E\n• Konsep: p × (q + 5) = pq + 5p, jadi nilainya butuh p, bukan hanya pq.\n• Langkah: dari (1) saja, p bisa 1, 2, 3, 4, 6, atau 12, sehingga nilainya 12 + 5p berubah-ubah. Dari (2) saja, pq tidak diketahui. Bersama-sama: pq = 12 dan p + q = 7 memberi (p, q) = (3, 4) atau (4, 3). Nilainya 27 atau 32, jadi tetap tidak pasti.\n• Jebakan: pq = 12 terlihat seperti \"bagian\" dari ekspresi, sehingga suku 5p terlupa. Pasangan (3, 4) dan (4, 3) mudah dianggap satu kemungkinan, padahal p tidak simetris di ekspresi.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e17","tgl":"2026-10-26","kode":"MD-18","jenis":"K · Belum paham konsep","soal":"Bilangan 4.071 dibulatkan ke atas ke puluhan. Hasilnya adalah ….\nA. 4.000  B. 4.070  C. 4.071  D. 4.080  E. 4.100","jawabku":"B. 4.070","bahas":"Jawaban benar & pembahasan: D (4.080)\n• Konsep: Pembulatan ke atas selalu naik ke kelipatan berikutnya kalau masih ada sisa, berapa pun sisanya. Aturan angka 5 hanya untuk \"terdekat\".\n• Langkah: Satuan = 1 (bukan 0), jadi ada sisa. Puluhan naik dari 70 ke 80, hasilnya 4.080.\n• Jebakan: 4.070 menggoda karena angka 1 kecil, padahal itu hasil pembulatan ke bawah atau terdekat.","status":"Ulang benar","sesiManual":null,"asal":"Materi Baru (LOTS)"},{"id":"e18","tgl":"2026-10-26","kode":"MD-18","jenis":"K · Belum paham konsep","soal":"Bilangan 3.201 dibulatkan ke atas ke ratusan. Hasilnya adalah ….","jawabku":"3200.0","bahas":"Jawaban benar & pembahasan: 3.300\n• Konsep: Sama seperti soal 4, \"ke atas\" berarti naik kalau ada sisa.\n• Langkah: Sisa setelah ratusan adalah 01, tidak nol. Ratusan naik dari 3.200 ke 3.300.\n• Jebakan: 3.200 adalah hasil pembulatan ke bawah atau terdekat. Satu satuan sisa saja sudah cukup untuk naik.","status":"Ulang benar","sesiManual":null,"asal":"Materi Baru (LOTS)"},{"id":"e19","tgl":"2026-10-26","kode":"MD-18","jenis":"K · Belum paham konsep","soal":"Hasil pembulatan 5.095 ke puluhan terdekat adalah","jawabku":"5090.0","bahas":"Jawaban benar & pembahasan: 5.100\n• Konsep: Pembulatan terdekat melihat satu digit di sebelah kanan tempat yang dibulatkan. Angka 5–9 membuat naik.\n• Langkah: Tempat yang dibulatkan adalah puluhan (9). Digit di kanannya adalah satuan 5, jadi puluhan naik dari 9 menjadi 10. Itu membawa ke ratusan, sehingga 5.095 menjadi 5.100.\n• Jebakan: 5.090 menggoda karena puluhan \"sudah 9, tidak bisa naik lagi\". Padahal 9 naik menjadi 10 dan menggeser digit di sebelah kirinya.","status":"Ulang benar","sesiManual":null,"asal":"Materi Baru (LOTS)"},{"id":"e20","tgl":"2026-10-26","kode":"MD-18","jenis":"H · Salah baca soal","soal":"Rudi membulatkan 4.649 ke puluhan terdekat, lalu hasilnya dibulatkan lagi ke ratusan terdekat. Selisih hasil Rudi dengan hasil pembulatan 4.649 langsung ke ratusan terdekat adalah ….","jawabku":"Jawabanku: 51","bahas":"Jawaban benar & pembahasan: 100\n• Konsep: Pembulatan berantai bisa memberi hasil berbeda dari pembulatan langsung, karena digit yang dilihat sudah berubah di langkah pertama.\n• Langkah: Cara Rudi: 4.649 → 4.650 (satuan 9, naik), lalu 4.650 → 4.700 (puluhan 5, naik). Cara langsung: 4.649 → 4.600 (puluhan 4, turun). Selisihnya 4.700 − 4.600 = 100.\n• Jebakan: Angka 51 menggoda karena membandingkan hasil Rudi dengan 4.649, padahal pembanding yang diminta adalah 4.600.","status":"Ulang benar","sesiManual":null,"asal":"Materi Baru (MOTS)"},{"id":"e21","tgl":"2026-10-27","kode":"VL-20","jenis":"T · Kurang teliti","soal":"Semua peserta lomba lari itu adalah anggota klub atletik. Tidak ada anggota klub atletik yang merokok. Sebagian peserta lomba lari itu adalah mahasiswa. Simpulan yang PASTI BENAR adalah ....\nA. Semua mahasiswa tidak merokok. B. Sebagian mahasiswa tidak merokok. C. Semua mahasiswa adalah anggota klub atletik. D. Semua anggota klub atletik adalah peserta lomba lari. E. Sebagian anggota klub atletik merokok.","jawabku":"A. Semua mahasiswa tidak merokok.","bahas":"Jawaban benar & pembahasan: B\n• Konsep: Kata \"sebagian\" hanya menjamin ada anggota yang beririsan. Sifat pada irisan itu tidak berlaku untuk seluruh himpunan.\n• Langkah: Peserta lomba ⊆ anggota klub, dan anggota klub tidak ada yang merokok, jadi peserta tidak merokok. Sebagian peserta adalah mahasiswa, jadi ada mahasiswa yang tidak merokok.\n• Jebakan: Opsi A terlihat benar karena nyambung dengan premis, tetapi hanya mahasiswa yang menjadi peserta yang terjamin tidak merokok.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e22","tgl":"2026-10-27","kode":"VL-14","jenis":"H · Salah baca soal","soal":"Diketahui p bernilai BENAR, q bernilai SALAH, dan r bernilai BENAR. Pernyataan berikut yang bernilai SALAH adalah ....\nA. p ∨ q B. ¬q ∧ r C. (p ∧ q) ∨ r D. p → q E. q → r","jawabku":"C. (p ∧ q) ∨ r","bahas":"Jawaban benar & pembahasan: D\n• Konsep: Hitung nilai kebenaran dari dalam kurung keluar. Implikasi bernilai salah hanya jika premis benar dan konklusi salah.\n• Langkah: (p ∧ q) = B∧S = S, lalu S ∨ r = S∨B = B. Jadi C benar. Untuk D, p → q = B → S = S, sehingga D yang salah.\n• Jebakan: Hasil p ∧ q yang salah menggoda untuk disimpulkan \"seluruhnya salah\", padahal masih ada ∨ r di luar kurung.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e23","tgl":"2026-10-27","kode":"MD-14","jenis":"T · Kurang teliti","soal":"Berdasarkan informasi yang diberikan, manakah hubungan antara kuantitas P dan Q berikut yang benar? P: Hasil pembulatan 0,375 ke dua angka di belakang koma. Q: Bentuk desimal dari 19/50.\nA. Kuantitas P lebih dari Q B. Kuantitas P kurang dari Q C. Kuantitas P sama dengan Q D. Tidak dapat ditentukan hubungan antara kuantitas P dan Q","jawabku":"A. Kuantitas P lebih dari Q","bahas":"Jawaban benar & pembahasan: C\n• Konsep: Pembulatan ke dua angka di belakang koma melihat digit ketiga. Pecahan berpenyebut 50 mudah diubah dengan menyamakan penyebut menjadi 100.\n• Langkah: P: 0,375, digit ketiga 5, naik menjadi 0,38. Q: 19/50 = 38/100 = 0,38. Jadi P = Q.\n• Jebakan: Kalau P dibulatkan ke 0,4 (satu angka) atau Q keliru dihitung, P tampak lebih besar.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e24","tgl":"2026-10-27","kode":"VL-20","jenis":"T · Kurang teliti","soal":"Semua dokter di rumah sakit itu adalah lulusan fakultas kedokteran. Sebagian lulusan fakultas kedokteran menjadi peneliti. Tidak ada peneliti yang bekerja di luar negeri. Simpulan yang PASTI BENAR adalah ....\nA. Sebagian lulusan fakultas kedokteran tidak bekerja di luar negeri. B. Semua dokter di rumah sakit itu adalah peneliti. C. Sebagian dokter di rumah sakit itu adalah peneliti. D. Sebagian lulusan fakultas kedokteran bekerja di luar negeri. E. Semua lulusan fakultas kedokteran tidak bekerja di luar negeri.","jawabku":"C. Sebagian dokter di rumah sakit itu adalah penelit","bahas":"Jawaban benar & pembahasan: A\n• Konsep: Dokter rumah sakit adalah himpunan bagian dari lulusan. \"Sebagian lulusan\" yang menjadi peneliti belum tentu memuat dokter rumah sakit itu.\n• Langkah: Ada lulusan yang menjadi peneliti. Peneliti tidak ada yang bekerja di luar negeri, jadi ada lulusan yang tidak bekerja di luar negeri (A).\n• Jebakan: Opsi C menggoda karena memakai kata \"dokter\" dan \"peneliti\" dari premis, tetapi kaitan dokter ke peneliti tidak pernah dinyatakan.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e25","tgl":"2026-10-27","kode":"VL-14","jenis":"T · Kurang teliti","soal":"Negasi dari pernyataan \"Sinta menyukai matematika dan Sinta menyukai fisika\" adalah ....\nA. Sinta tidak menyukai matematika dan tidak menyukai fisika. B. Sinta tidak menyukai matematika atau tidak menyukai fisika. C. Sinta menyukai matematika atau menyukai fisika. D. Sinta menyukai matematika tetapi tidak menyukai fisika. E. Sinta tidak menyukai matematika dan menyukai fisika.","jawabku":"C. Sinta menyukai matematika atau menyukai fisika","bahas":"Jawaban benar & pembahasan: B\n• Konsep: De Morgan: ¬(p ∧ q) ≡ ¬p ∨ ¬q. Operator berubah dan kedua komponen dinegasikan.\n• Langkah: p = menyukai matematika, q = menyukai fisika. Negasinya: tidak menyukai matematika atau tidak menyukai fisika.\n• Jebakan: Opsi C hanya mengganti \"dan\" menjadi \"atau\" tanpa menegasikan komponen.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e26","tgl":"2026-10-28","kode":"MD-19","jenis":"T · Kurang teliti","soal":"Berapa banyak suku pada bentuk aljabar ax² + bx + 4, dengan a dan b adalah konstanta?\n(1) a > 0.\n(2) a ≠ 0.\nPutuskan apakah pernyataan (1) dan (2) berikut cukup untuk menjawab pertanyaan tersebut.\nA. Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.\nB. Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.\nC. DUA pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.\nD. Pernyataan (1) SAJA cukup untuk menjawab pertanyaan dan pernyataan (2) SAJA cukup.\nE. Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan.","jawabku":"A. Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.","bahas":"Jawaban benar & pembahasan: E\n• Konsep: Banyak suku ditentukan oleh koefisien yang bukan nol. Konstanta 4 selalu ada, suku x² ada jika a ≠ 0, dan suku x ada jika b ≠ 0.\n• Langkah: Kedua pernyataan hanya membahas a, padahal b tidak diketahui. Jika b = 0, suku-sukunya 2; jika b ≠ 0, suku-sukunya 3. Jadi banyak suku tidak bisa dipastikan, sehingga (1) dan (2) tidak cukup, bahkan jika digabung.\n• Jebakan: Pernyataan tentang a terasa \"menentukan\" karena a ada di suku pertama, sehingga b terlupakan. Selain itu, pilihan A janggal secara logika: a > 0 sudah pasti berarti a ≠ 0. Jika (1) cukup, (2) pasti ikut cukup.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e27","tgl":"2026-10-30","kode":"MD-09","jenis":"H · Salah baca soal","soal":"Soal: Sebuah ruangan berukuran 360 cm × 240 cm akan ditutup seluruhnya dengan ubin persegi berukuran sama dan sebesar mungkin, tanpa ada ubin yang dipotong. Banyak ubin yang diperlukan adalah ....\nA. 6 · B. 24 · C. 96 · D. 120 · E. 720","jawabku":"D. 120","bahas":"Jawaban benar & pembahasan: A (6)\n• Konsep: ubin terbesar tanpa sisa memakai sisi = FPB panjang dan lebar. Banyak ubin = luas ruangan ÷ luas satu ubin.\n• Langkah: FPB(360, 240) = 120 cm. Ubin sepanjang 360 cm = 360 ÷ 120 = 3, dan sepanjang 240 cm = 240 ÷ 120 = 2. Banyak ubin = 3 × 2 = 6.\n• Jebakan: 120 adalah hasil FPB itu sendiri, jadi menggoda kalau berhenti di tengah soal. Pilihan 24 dan 96 berasal dari sisi ubin 60 cm dan 30 cm (bukan yang terbesar), sedangkan 720 adalah KPK.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e28","tgl":"2026-10-31","kode":"VL-04","jenis":"K · Belum paham konsep","soal":"Bacalah teks berikut!\n(1) Warga Desa Sukamaju mengadakan kerja bakti pada hari Minggu pagi.\n(2) Mereka membersihkan saluran air yang tersumbat oleh sampah plastik.\n(3) Kegiatan itu dipimpin oleh Darmawan, ketua rukun warga setempat.\n(4) Para pemuda mengecat pagar balai desa dengan warna hijau.\n(5) Ibu-ibu menyiapkan makanan ringan dan minuman untuk para peserta.\n(6) Setelah seluruh pekerjaan selesai, Mereka berfoto bersama di depan balai desa.\nImbuhan ter- pada kata tersumbat (kalimat 2) bermakna ....\nA. paling (menyatakan tingkat tertinggi)\nB. tidak sengaja\nC. dapat (menyatakan kemungkinan)\nD. dalam keadaan (menyatakan hasil suatu tindakan)\nE. melakukan secara berulang-ulang","jawabku":"B. tidak sengaja","bahas":"Jawaban benar & pembahasan: D\n• Konsep: Ter- pada kata kerja bisa berarti keadaan hasil suatu tindakan (tersumbat, terkunci), tidak sengaja (terinjak, tertabrak), paling (tertinggi), atau dapat (terbaca).\n• Langkah: Saluran air yang tersumbat berarti saluran itu sedang dalam keadaan tertutup sampah. Kalimat tidak membahas siapa yang menyumbat atau apakah disengaja.\n• Jebakan: Ter- sering dihafal sebagai \"tidak sengaja\", padahal itu hanya salah satu maknanya. Makna itu cocok bila ada pelaku yang berbuat keliru, bukan keadaan benda.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e29","tgl":"2026-11-02","kode":"MD-18","jenis":"T · Kurang teliti","soal":"Bendahara panitia bazar sekolah memperkirakan biaya belanja dengan cara cepat. Banyak barang dibulatkan ke puluhan terdekat, harga satuan dibulatkan ke ribuan terdekat, lalu kedua hasil pembulatan itu dikalikan. Perkiraan biaya total adalah jumlah perkiraan biaya semua barang. Data belanja sebagai berikut.\nBarang | Banyak | Harga satuan\nKaos panitia | 38 | Rp46.500,00\nBotol minum | 64 | Rp7.450,00\nKotak makan | 125 | Rp12.600,00\n8. Panitia menambah pesanan kotak makan dengan harga satuan tetap. Setelah penambahan, perkiraan biaya kotak makan menurut cara bendahara menjadi Rp1.820.000,00. Banyak kotak makan paling banyak yang mungkin dipesan adalah ....\nA. 140 · B. 144 · C. 145 · D. 149 · E. 150","jawabku":"A. 140","bahas":"Jawaban benar & pembahasan: B\n• Konsep: Kalau hasil pembulatan diketahui, bilangan aslinya berupa rentang. Bilangan yang dibulatkan ke puluhan menjadi 140 ada di 135–144.\n• Langkah: Harga Rp12.600,00 dibulatkan menjadi Rp13.000,00. Lalu 1.820.000 ÷ 13.000 = 140, artinya banyak kotak setelah dibulatkan = 140. Rentang aslinya 135–144, jadi paling banyak 144.\n• Jebakan: 140 adalah hasil hitungan yang \"bersih\", sehingga terasa seperti jawaban akhir. Kata \"paling banyak yang mungkin\" adalah sinyal bahwa kamu harus mencari batas rentang.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e30","tgl":"2026-11-02","kode":"VL-15","jenis":"T · Kurang teliti","soal":"23. Tika diterima menjadi anggota inti OSIS jika ia lulus tes tertulis dan lulus wawancara. Pengumuman hari ini menyatakan bahwa Tika tidak diterima menjadi anggota inti OSIS. Tika sudah dua tahun aktif di kegiatan pramuka.\nBerdasarkan informasi di atas, kesimpulan yang PALING TEPAT adalah ...\nA. Tika tidak lulus tes tertulis dan tidak lulus wawancara.\nB. Tika tidak lulus wawancara.\nC. Tika lulus tes tertulis, tetapi tidak lulus wawancara.\nD. Tika tidak diterima karena aktif di kegiatan pramuka.\nE. Tika tidak lulus tes tertulis atau tidak lulus wawancara.","jawabku":"A. Tika tidak lulus tes tertulis dan tidak lulus wawancara.","bahas":"Jawaban benar & pembahasan: E\n• Konsep: Dari (p ∧ q) → r dan ¬r, modus tollens memberi ¬(p ∧ q). Menurut De Morgan, ¬(p ∧ q) ≡ ¬p ∨ ¬q.\n• Langkah: Tika tidak diterima, artinya \"lulus tertulis dan lulus wawancara\" salah. Cukup salah satunya yang gagal, jadi kesimpulannya: tidak lulus tertulis atau tidak lulus wawancara.\n• Jebakan: Opsi A terdengar sejajar dengan premis (sama-sama memakai \"dan\"). Padahal A terlalu kuat karena menuntut Tika gagal di keduanya.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e31","tgl":"2026-10-03","kode":"MD-14","jenis":"T · Kurang teliti","soal":"Nilai angka 8 pada bilangan 47,386 adalah .... A. 0,008 B. 0,08 C. 0,8 D. 8 E. 80","jawabku":"E.80","bahas":"Jawaban benar & pembahasan: B\n• Konsep: setelah koma, posisinya berturut-turut persepuluhan, perseratusan, perseribuan.\n• Langkah: 4 (puluhan), 7 (satuan), 3 (persepuluhan), 8 (perseratusan), 6 (perseribuan). Nilai angka 8 = 8 × 0,01 = 0,08.\n• Jebakan: kalau koma diabaikan, angka 8 di deret 4-7-3-8-6 terbaca seperti puluhan.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"},{"id":"e32","tgl":"2026-10-03","kode":"VL-20","jenis":"T · Kurang teliti","soal":"Semua peserta Seminar Literasi Digital menerima sertifikat. Sebagian penerima sertifikat mendapat buku panduan. Berdasarkan informasi tersebut, manakah pernyataan berikut yang PASTI SALAH? A. Sebagian peserta seminar mendapat buku panduan. B. Semua penerima sertifikat adalah peserta seminar. C. Sebagian penerima sertifikat tidak mendapat buku panduan. D. Ada peserta seminar yang tidak menerima sertifikat. E. Tidak ada peserta seminar yang mendapat buku panduan.","jawabku":"A. Sebagian peserta seminar mendapat buku panduan.","bahas":"Jawaban benar & pembahasan: D\n• Konsep: PASTI SALAH berarti bertentangan langsung dengan premis. Pernyataan yang hanya \"belum tentu\" masih mungkin benar.\n• Langkah: D adalah negasi dari \"semua peserta menerima sertifikat\", jadi pasti salah. A, B, C, dan E semuanya mungkin terjadi.\n• Jebakan: A tidak bisa dipastikan benar, sehingga terasa salah. Padahal penerima buku bisa saja peserta seminar.","status":"Ulang benar","sesiManual":null,"asal":"Interleaving"}],"vdays":[{"d":"2026-10-16","new":"CT2-P01","r1":null,"r3":null,"r7":null},{"d":"2026-10-17","new":"CT2-P02","r1":"CT2-P01","r3":null,"r7":null},{"d":"2026-10-18","new":null,"r1":"CT2-P02","r3":null,"r7":null},{"d":"2026-10-19","new":"CT2-P03","r1":null,"r3":"CT2-P01","r7":null},{"d":"2026-10-20","new":"CT2-P04","r1":"CT2-P03","r3":"CT2-P02","r7":null},{"d":"2026-10-21","new":"CT2-P05","r1":"CT2-P04","r3":null,"r7":null},{"d":"2026-10-22","new":"CT2-P06","r1":"CT2-P05","r3":"CT2-P03","r7":null},{"d":"2026-10-23","new":"CT2-P07","r1":"CT2-P06","r3":"CT2-P04","r7":"CT2-P01"},{"d":"2026-10-24","new":"CT2-P08","r1":"CT2-P07","r3":"CT2-P05","r7":"CT2-P02"},{"d":"2026-10-25","new":null,"r1":"CT2-P08","r3":"CT2-P06","r7":null},{"d":"2026-10-26","new":"CT2-P09","r1":null,"r3":"CT2-P07","r7":"CT2-P03"},{"d":"2026-10-27","new":"CT2-P10","r1":"CT2-P09","r3":"CT2-P08","r7":"CT2-P04"},{"d":"2026-10-28","new":null,"r1":"CT2-P10","r3":null,"r7":"CT2-P05"},{"d":"2026-10-29","new":null,"r1":null,"r3":"CT2-P09","r7":"CT2-P06"},{"d":"2026-10-30","new":"TFL-P01","r1":null,"r3":"CT2-P10","r7":"CT2-P07"},{"d":"2026-10-31","new":"TFL-P02","r1":"TFL-P01","r3":null,"r7":"CT2-P08"},{"d":"2026-11-01","new":null,"r1":"TFL-P02","r3":null,"r7":null},{"d":"2026-11-02","new":"TFL-P03","r1":null,"r3":"TFL-P01","r7":"CT2-P09"},{"d":"2026-11-03","new":"TFL-P04","r1":"TFL-P03","r3":"TFL-P02","r7":"CT2-P10"},{"d":"2026-11-04","new":"TFL-P05","r1":"TFL-P04","r3":null,"r7":null},{"d":"2026-11-05","new":"TFL-P06","r1":"TFL-P05","r3":"TFL-P03","r7":null},{"d":"2026-11-06","new":"TFL-P07","r1":"TFL-P06"," const vRevs = v => v ? [['H+1',v.r1],['H+3',v.r3],['H+7',v.r7]].filter(x => x[1]) : [];
function vNewDone(d){ const q = eff('v'+d); return VSTEPS.every(([f]) => q[f]); }
function vNewCount(d){ const q = eff('v'+d); return VSTEPS.filter(([f]) => q[f]).length; }
const HABITS = [['a','Anak Tangga','Habit Alternatifa'],['o','Obat Fokus','Habit Alternatifa'],['b','Balon Helium','Habit Alternatifa']];

function dayRows(d){
  const a = arsipOn(d); if (a) return Object.assign(a, {arsip:true});
  const ss = sessionsOn(d);
  return { ss,
    materi: BS.materi.filter(x => ss.includes(x.s)),
    review: BS.review.filter(x => ss.includes(x.s)),
    timed: BS.timed.filter(x => ss.includes(x.s)) };
}
function dayTasks(d){
  const r = dayRows(d), v = vday(d), h = eff('h'+d), T = [];
  HABITS.forEach(([f,l]) => T.push({l, done: !!h[f]}));
  r.materi.forEach((x,i) => T.push({l:'Materi '+(i+1), done: matBeres(x)}));
  if (r.review.length){ const n = r.review.filter(revBeres).length; T.push({l:'Review campur', done: n===r.review.length, part: n>0}); }
  if (r.timed.length){ const n = r.timed.filter(timedBeres).length; T.push({l:'Timed drill', done: n===r.timed.length, part: n>0}); }
  if (v && v.new) T.push({l:'Vocab baru', done: vNewDone(d), part: vNewCount(d)>0});
  if (v && vRevs(v).length) T.push({l:'Vocab review', done: !!eff('v'+d).rev});
  const lt = lkTask(d); if (lt) T.push(lt);
  const pt = ppTask(d); if (pt) T.push(pt);
  return T;
}
function dayPct(d){ const T = dayTasks(d); return T.length ? T.filter(t=>t.done).length / T.length : null; }
function dayStatus(d){ const T = dayTasks(d), n = T.filter(t=>t.done).length; return !T.length ? '–' : n===T.length ? 'Lengkap' : n>0 ? 'Sebagian' : 'Belum'; }

/* tertinggal: tugas jadwal sebelum hari ini yang belum beres (habit tidak dihitung) */
function overdue(before){
  const S = sessions(), out = [];
  // hanya jadwal v13; sisa jadwal v7 tidak dihitung karena Matematika Dasar diulang dari awal
  BS.materi.forEach(x => { const d=S[x.s]; if (d && d<before && !matBeres(x)) out.push({d, t:'Materi '+x.kode+' · '+x.sub+(x.ke?' '+x.ke:''), st: matStatus(eff(x.k))}); });
  const revBy = {}; BS.review.forEach(x => { const d=S[x.s]; if (d && d<before && !revBeres(x)) (revBy[d] = revBy[d]||[]).push(x); });
  Object.entries(revBy).forEach(([d,xs]) => out.push({d, t:'Review campur ('+xs.length+' baris belum lengkap)', st:'Belum'}));
  BS.timed.forEach(x => { const d=S[x.s]; if (d && d<before && !timedBeres(x)) out.push({d, t:'Timed drill '+subjShort(x.subj), st:'Belum'}); });
  vdays().forEach(v => { if (v.d >= before) return;
    if (v.new && !vNewDone(v.d)) out.push({d:v.d, t:'Vocab baru '+v.new+' ('+vNewCount(v.d)+'/4 langkah)', st:'Belum'});
    if (vRevs(v).length && !eff('v'+v.d).rev) out.push({d:v.d, t:'Vocab review '+vRevs(v).map(x=>x[1]).join(', '), st:'Belum'}); });
  return out.sort((a,b) => a.d<b.d?-1:1);
}

function studyOrder(d){

  if (ppTask(d)) apps.push({t:'Latihan PPU & PBM', s:APPS[1].s, url:APPS[1].url});
  apps.push({t:'Vocab Lab', s:APPS[2].s, url:APPS[2].url});
  const mat = r.materi.map(x => {
    const utbk = x.subj && !/^(Mat|Verbal)/.test(x.subj);
    const nm = /^Mat/.test(x.subj||'') ? 'Mat Dasar' : utbk ? subjShort(x.subj) : (x.subj||'Materi');

  });

  while (ai < apps.length) steps.push(apps[ai++]);

function readVal(el){
  const t = el.dataset.t, v = el.value;
  if (t==='text') return v.trim()==='' ? null : v;
  if (v==='') return null;
  const n = parseFloat(String(v).replace(',','.')); if (!isFinite(n)) return null;
  return t==='pct' ? Math.round(n*10)/1000 : n;
}

function shiftSessions(from){
  const S = sessions(), cur = Object.assign({}, ST.ov.sessions2||{});
  Object.keys(S).map(Number).filter(s => s>=from && S[s] && !SUNS.has(s)).forEach(s => { let d = addDays(S[s],1); while (pd(d).getDay()===0 || HOLI.includes(d)) d = addDays(d,1); cur[s] = d; });
  ST.ov.sessions2 = cur; ST.confirm=null; Store.write('sessions2'); render(); toast('Sesi '+from+' dan setelahnya digeser 1 hari');
}
function addError(e){

async function exportFile(){

  catch(err){ if (err && err.code==='declined') return; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt],{type:'application/json'})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); } catch(e){}
  const ta = $('#dump'); if (ta){ ta.value = txt; } toast('Kalau unduhan tidak muncul, salin teks di kotak');
}
async function importText(txt){
  let o; try { o = JSON.parse(txt); } catch(e){ toast('Isi cadangan tidak bisa dibaca. Pastikan teksnya lengkap.'); return; }
  if (!o || typeof o.ov !== 'object'){ toast('Ini bukan file cadangan Progres Harian Terpadu'); return; }
  Object.assign(ST.ov, o.ov); render(); toast('Mengimpor '+Object.keys(o.ov).length+' catatan…');

}

  mode:'local', col:null, timers:{}, dirty:new Set(), chain:{}, failed:false,
  saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(ST.ov)); } catch(e){} },
  loadLocal(){ ST.ov = JSON.parse(JSON.stringify(SEED)); try { const s = localStorage.getItem(LS); if (s) ST.ov = JSON.parse(s) || {}; } catch(e){} },
  badge(state, text){ this._b = [state, text]; const el = $('#sync'); if (!el) return; el.className = 'sync '+state; el.querySelector('span').textContent = text; },
  idle(){ this.badge(this.failed?'err':'ok', this.failed ? 'Gagal sinkron, tersimpan di browser' : this.mode==='db' ? 'Tersimpan di akun' : 'Tersimpan di browser ini'); },
  write(k){
    this.saveLocal(); if (this.mode!=='db') { this.idle(); return; }
    this.dirty.add(k); this.badge('busy','Menyimpan…');
    clearTimeout(this.timers[k]); this.timers[k] = setTimeout(() => this.flush(k), 700);
  },
  flush(k){
    const run = async () => {
      const body = ST.ov[k];
      try { if (body && Object.keys(body).length) await this.col.doc(k).set(JSON.parse(JSON.stringify(body))); else await this.col.doc(k).delete(); this.failed = false; }
